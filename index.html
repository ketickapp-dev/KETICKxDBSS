<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBSS OS | Secure Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: rgba(20, 25, 40, 0.7);
            --text-main: #FFFFFF;
            --text-muted: #8b9bb4;
            --accent-blue: #00f0ff;
            --accent-lime: #00ff66;
            --accent-orange: #ff9900;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: radial-gradient(circle at top right, rgba(0, 240, 255, 0.05), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(0, 255, 102, 0.05), transparent 40%);
        }

        /* GLASSMORPHISM BENTO CARD */
        .login-container {
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            backdrop-filter: blur(12px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 240, 255, 0.1);
        }

        .brand-logo {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .brand-logo span {
            color: var(--accent-lime);
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }

        .system-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: var(--accent-blue);
        }

        .tagline {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* MICRO-INTERACTIONS PADA INPUT */
        .form-group input {
            width: 100%;
            padding: 14px;
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--accent-lime);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transform: scale(1.02);
        }

        .form-group input::placeholder {
            color: #4A5568;
        }

        /* MICRO-INTERACTIONS PADA BUTANG */
        .btn-submit {
            width: 100%;
            background: linear-gradient(45deg, #00f0ff, #0080ff);
            color: #000;
            border: none;
            padding: 15px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
            background: linear-gradient(45deg, #00ffff, #00aaff);
        }

        .status-msg {
            margin-top: 15px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-orange);
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .status-msg.show {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="brand-logo">dbss<span>&#8599;</span></div>
        <div class="system-name">DBSS OS | COMMAND CENTER</div>
        <div class="tagline">Satu Ketikan, Seribu Solusi.</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">ID Pengguna</label>
                <input type="text" id="username" placeholder="Masukkan ID Sistem" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="password">Kata Laluan Pintasan</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Execute Process</button>
        </form>

        <div class="status-msg" id="statusMessage">Akses Ditolak. Sila semak kredensial.</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const statusMsg = document.getElementById('statusMessage');

            // Logik sementara sebelum integrasi backend
            if (user !== "" && pass !== "") {
                // Berjaya
                statusMsg.style.color = "var(--accent-lime)";
                statusMsg.innerText = "[✓] Akses Dibenarkan. Menghubungkan ke pelayan...";
                statusMsg.classList.add('show');
                
                // Alih ke dashboard selepas 1.5 saat untuk paparan animasi
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1500);
            } else {
                // Gagal
                statusMsg.style.color = "var(--accent-orange)";
                statusMsg.innerText = "[!] Ralat Operasi: Input tidak lengkap.";
                statusMsg.classList.add('show');
            }
        });
    </script>

</body>
</html>
